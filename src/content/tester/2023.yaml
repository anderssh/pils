intro:
  - Dette året er vi i Harstad.
  - Det er juni, deilig vær tre uker på rad på østlandet. I Harstad, mer variabelt. Men allikevel
    finner kjernen av kjernen, kremen av del le créme veien til den Hare Stad for årets ølsmaking,
    og De ølympiske leker. Fredag ettermiddag møtes de tre aktuelle aktørene på Gardermuen for
    avreise til Evenes flyplass. Kristoffer og Anders kjørte sammen til Gardermoen P4 L3 og miste
    shuttlebussen, og endte dermed opp med å ta taxi til terminale, rakk en stor pils, rakk flyet.
    Anette henta oss og vi var på G i Mercurveien for Pizza og Meet´n greet med både kone og unger
    fredag, helt topp.
  - Lørdag ble det plenty av skyting på bane, både pistol, 4-16, 4-17 og laser-rifle. Kristoffer
    vinner konkurransen, videre går turen til Hinstein for en deilig topptur, ca 50 min opp og 25
    minutter ned, burger så tilbake til leiren for selve ølsmakinga, og både bålkonkurranse og det
    ene med det andre (musikk-quiz).
  - Pilsnertung i år, og ikke minst Mack-tungt! Det viser seg tilogmed at Pokal pr juni 2023 også
    ligger under Mack-imperiet. Passende da, og ikke helt tilfeldig at vi befinner os nordafør den
    sirkelen som gjerne betegnes som polar.
