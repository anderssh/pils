intro:
  - Dette året er vi i Thornes gate 13.
  - Det er romjul, vi er samla, og det er burger og fries på G. Snøen faller, Vetle har akkurat fått
    sin første datter, og TH fikk Jesper for et par måneder tilbake. Kristoffer bor på gjesterommet
    her i Thornes gate. Denne gangen var det 10 øl som skulle testes. Færre enn før, og årsaken er i
    hovedsak at butikkene var ribba for juleøl i romjul.
  - Årets vinner er den samme som i fjor! Muligens ikke helt samme øl, men jævlig nært, iaf! Samme
    bryggeri, samme beskrivelse av farge og smak fra panelet.
