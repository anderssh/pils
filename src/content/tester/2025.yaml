intro:
  - Dette året er vi i Hønefos, og det er vinnern av 2023-versjonen av juleøltesten, altså Anders,
    som arrangerer. Den harde kjerne av ølsmakerorkersteret er med.
  - Det er nesten to år siden siste installasjon av øltesten, da i Harstad. Denne gangen er det helt
    vanlig øl som skal testes, dog med et litt ekstra høy forekomst av smakstilsatt øl på skjemaet.
    Det er høst i været, TH har tatt turen ned, Anders henta på Gardis, Kristoffer jobber natt til
    lørdag, og Vetle er i temmelig lusen form. Men! Test, og ikke minst ølympiske leker, skal det
    bli!
  - Lørdagens formiddag går med til Ungehenting og -underholdning, en suppeøkt på gymmen, innkjøp av
    øl, leker og andre forberedende oppgaver. Middagen blir server av Babol via Foodora og selve
    testen er i gang ca klokka 18:00.
  - Testens gjennomføring er i kjent format, gutta på plass, ark forran seg, ølen smakes, beskrives,
    rapes og vurderes opp, ned og i mente. Vetle har etter en runde med Covid for et par år siden
    mistet mye av sin luktesans, og nå i forbindelse med pågående sykdom også mye av sin smakssans.
    Det kan se ut til å ha gitt seg utslag i mange vurderinger rundt «70»-tallet fra hans
    vedkommende, med kommentaren «lett å få ned, men lite smak». Årets installasjon er dermed å
    regne som et ølympisk og paraølympisk arrangement.
  - Ekstremt tett i toppen i år, men kun ett poeng som skiller ølene på pall. Men øverst av de alle
    troner «Isbjørn Lite med smak av blodappelsin», som kun fikk 53,3 lepper i forrige avsnitt(!).
activities:
  - Øl på skakka – vinner Thor-Håkon
  - Øl på brua – vinner Vetle
